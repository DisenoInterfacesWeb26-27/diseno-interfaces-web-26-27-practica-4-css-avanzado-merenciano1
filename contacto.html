<body>

        <a href="./index.html"><img src="./assets/images/logo-clinica-diw.jpg" width="200" height="100"

            </li>
        </ul>
    </nav>
    <main>
        <h1>FORMULARIO DE CONTACTO</h1>
        <form id="formulario-contacto">
            <fieldset>
                <legend>Datos a rellenar</legend>

                <label>Nombre</label>
                <input type="text" id="nombre" name="nombre" maxlength="40" placeholder="Introducir nombre..."
                    pattern="[A-Za-z0-9]+" autofocus required>
                <br>
                <label>Email</label>
                <input type="email" id="email" name="email" placeholder="Introducir email de contacto..." required>
                <br>
                <label>Edad</label>
                <input type="number" id="edad" name="edad" min="18" max="99" placeholder="Introducir edad..." required>
                <br>
                <label>Teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Introducir número de teléfono" required>
                <br>
                <label>Consulta</label> <br>
                <textarea id="consulta" name="consulta" rows="10" cols="50" placeholder="Su consulta..."
                    required></textarea>
                <br>
                <label id="texto-aceptar">Acepto la política de privacidad y cookies</label>
                <input type="checkbox" id="politica-privacidad" name="politicaPrivacidad" required>
            </fieldset>
            <br><br>

            <button>Enviar</button>
        </form>

        <section>
            <h2>Datos de contacto</h2>

            <p>Clínica DIW</p>
            <p>Email: <a href="mailto:clinicadiw@email.com">clinicadiw@email.com</a></p>
            <p>Teléfono: <a href="tel:+34123456789">123 456 789</a></p>
        </section>
    </main>
    <footer>
        <p>2026, Clínica DIW</p>
